[package]
name = "quorium"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-nats = "0.50.0"
bytes = "1.12.1"
futures = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
