[package]
name = "quorium"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-nats = "0.50.0"
async-trait = "0.1.91"
bytes = "1.12.1"
futures = "0.3.33"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
